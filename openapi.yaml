openapi: 3.0.3

info:
  title: Restaurant API
  version: 1.0.0
  description: Restaurant API backed by SQLite.

servers:
  - url: http://127.0.0.1:5000

paths:

  /menu:
    get:
      tags:
        - Menu
      operationId: listMenu
      summary: List available menu items
      responses:
        '200':
          description: Menu items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

  /menu/{id}:
    get:
      tags:
        - Menu
      operationId: getMenuItem
      summary: Get a menu item
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Menu item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          description: Menu item not found.

  /customers:
    post:
      tags:
        - Customers
      operationId: createCustomer
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      responses:
        '201':
          description: Customer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          description: Invalid customer data.
        '409':
          description: Email already exists.

  /tables:
    get:
      tags:
        - Tables
      operationId: listDiningTables
      summary: List active dining tables
      responses:
        '200':
          description: Dining tables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiningTable'

  /reservations:
    post:
      tags:
        - Reservations
      operationId: createReservation
      summary: Create a reservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreate'
      responses:
        '201':
          description: Reservation created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Invalid reservation.
        '404':
          description: Customer or dining table not found.
        '409':
          description: Dining table already reserved.

  /reservations/{id}:
    get:
      tags:
        - Reservations
      operationId: getReservation
      summary: Get a reservation
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Reservation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          description: Reservation not found.

  /orders:
    post:
      tags:
        - Orders
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        '201':
          description: Order created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreated'
        '400':
          description: Invalid order.
        '404':
          description: Referenced customer, table, reservation, or menu item not found.
        '409':
          description: Order conflict.

  /orders/{id}:
    get:
      tags:
        - Orders
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Order with items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Order not found.

  /orders/{id}/status:
    patch:
      tags:
        - Orders
      operationId: updateOrderStatus
      summary: Update order status
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Order status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummary'
        '400':
          description: Invalid status.
        '404':
          description: Order not found.
        '409':
          description: Invalid status transition.

  /customers/{id}/orders:
    get:
      tags:
        - Customers
      operationId: listCustomerOrders
      summary: List orders for a customer
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Customer order history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummary'
        '404':
          description: Customer not found.


components:

  parameters:

    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1


  schemas:

    MenuItem:
      type: object
      required:
        - id
        - category_id
        - category_name
        - name
        - price_cents
        - available
      properties:
        id:
          type: integer
          minimum: 1
        category_id:
          type: integer
          minimum: 1
        category_name:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        price_cents:
          type: integer
          minimum: 0
        available:
          type: boolean


    CustomerCreate:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true


    Customer:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
        email:
          type: string
        phone:
          type: string
          nullable: true


    DiningTable:
      type: object
      required:
        - id
        - label
        - seats
        - active
      properties:
        id:
          type: integer
          minimum: 1
        label:
          type: string
        seats:
          type: integer
          minimum: 1
        active:
          type: boolean


    ReservationCreate:
      type: object
      required:
        - customer_id
        - dining_table_id
        - reservation_time
        - party_size
      properties:
        customer_id:
          type: integer
          minimum: 1
        dining_table_id:
          type: integer
          minimum: 1
        reservation_time:
          type: string
        party_size:
          type: integer
          minimum: 1


    Reservation:
      type: object
      required:
        - id
        - customer_id
        - dining_table_id
        - reservation_time
        - party_size
        - status
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
        dining_table_id:
          type: integer
          minimum: 1
        reservation_time:
          type: string
        party_size:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - ACTIVE
            - CANCELLED


    OrderItemCreate:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: integer
          minimum: 1
        quantity:
          type: integer
          minimum: 1


    OrderCreate:
      type: object
      required:
        - items
      properties:
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemCreate'


    OrderCreated:
      type: object
      required:
        - id
        - status
        - total_cents
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - NEW
            - PREPARING
            - READY
            - COMPLETED
            - CANCELLED
        total_cents:
          type: integer
          minimum: 0


    OrderItem:
      type: object
      required:
        - id
        - menu_item_id
        - quantity
        - unit_price_cents
        - line_total_cents
      properties:
        id:
          type: integer
          minimum: 1
        menu_item_id:
          type: integer
          minimum: 1
        menu_item_name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unit_price_cents:
          type: integer
          minimum: 0
        line_total_cents:
          type: integer
          minimum: 0


    OrderSummary:
      type: object
      required:
        - id
        - status
        - total_cents
        - created_at
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - NEW
            - PREPARING
            - READY
            - COMPLETED
            - CANCELLED
        total_cents:
          type: integer
          minimum: 0
        created_at:
          type: string


    Order:
      type: object
      required:
        - id
        - status
        - total_cents
        - created_at
        - items
      properties:
        id:
          type: integer
          minimum: 1
        customer_id:
          type: integer
          minimum: 1
          nullable: true
        dining_table_id:
          type: integer
          minimum: 1
          nullable: true
        reservation_id:
          type: integer
          minimum: 1
          nullable: true
        status:
          type: string
          enum:
            - NEW
            - PREPARING
            - READY
            - COMPLETED
            - CANCELLED
        total_cents:
          type: integer
          minimum: 0
        created_at:
          type: string
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'


    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - NEW
            - PREPARING
            - READY
            - COMPLETED
            - CANCELLED